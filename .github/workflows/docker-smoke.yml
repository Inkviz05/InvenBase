name: Docker Compose smoke

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invenbase-client/web/package-lock.json

      - name: Install web dependencies
        working-directory: invenbase-client/web
        run: npm ci

      - name: Install Chromium
        working-directory: invenbase-client/web
        run: npx playwright install --with-deps chromium

      - name: Build stack and run browser smoke test
        shell: pwsh
        run: ./scripts/test-docker-compose-smoke.ps1

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            invenbase-client/web/playwright-report
            invenbase-client/web/test-results
          if-no-files-found: ignore
