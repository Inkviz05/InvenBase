name: InvenBase CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invenbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invenbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invenbase_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run backend tests against clean PostgreSQL
        working-directory: invenbase-server
        run: cargo test --locked

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: invenbase-android
        run: chmod +x gradlew

      - name: Build Android debug APK
        working-directory: invenbase-android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: invenbase-android-debug
          path: invenbase-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invenbase-client/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install web dependencies
        working-directory: invenbase-client/web
        run: npm ci

      - name: Audit web dependencies
        working-directory: invenbase-client/web
        run: npm audit --audit-level=high

      - name: Test web client
        working-directory: invenbase-client/web
        run: npm run test:run

      - name: Build web client
        working-directory: invenbase-client/web
        run: npm run build

      - name: Check Rust formatting
        working-directory: invenbase-server
        run: cargo fmt --check

      - name: Test backend library
        working-directory: invenbase-server
        run: cargo test --locked --lib

      - name: Enforce production hardening
        shell: bash
        run: |
          if grep -R "console\.log" invenbase-client/web/src; then
            echo "Production console.log calls are not allowed"
            exit 1
          fi
          if grep -R "show_files_listing" invenbase-server/src; then
            echo "Static directory listing must stay disabled"
            exit 1
          fi

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invenbase-client/web/package-lock.json

      - name: Install web dependencies
        working-directory: invenbase-client/web
        run: npm ci

      - name: Install Chromium
        working-directory: invenbase-client/web
        run: npx playwright install --with-deps chromium

      - name: Build stack and run browser smoke test
        shell: pwsh
        run: ./scripts/test-docker-compose-smoke.ps1

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            invenbase-client/web/playwright-report
            invenbase-client/web/test-results
          if-no-files-found: ignore
