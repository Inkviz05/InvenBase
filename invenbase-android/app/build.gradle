plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def huaweiEnabled = file('agconnect-services.json').exists()
if (huaweiEnabled) {
    apply plugin: 'com.huawei.agconnect'
}

def rustoreProjectId = providers.gradleProperty("RUSTORE_PROJECT_ID")
        .orElse(providers.environmentVariable("RUSTORE_PROJECT_ID"))
        .orElse("")
        .get()

android {
    namespace 'com.invenbase.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.invenbase.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "boolean", "HUAWEI_ENABLED", huaweiEnabled.toString()

        buildConfigField "String", "RUSTORE_PROJECT_ID", "\"${rustoreProjectId}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.5'
    implementation 'androidx.navigation:navigation-ui:2.7.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // QR Code Scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // SharedPreferences wrapper
    implementation 'androidx.preference:preference:1.2.1'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // RuStore Push SDK
    implementation 'ru.rustore.sdk:pushclient:7.5.0'
    implementation 'com.huawei.hms:push:6.3.0.302'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
